<div style="padding: 20px; border: 1px solid #ccc; max-width: 400px; margin: 20px auto; border-radius: 8px;">
  <h2 style="text-align: center; color: #2e7d32;">Add Crop</h2>

  <div *ngIf="message" style="padding: 10px; background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; margin-bottom: 15px; font-weight: bold; text-align: center; border-radius: 4px;">
    {{ message }}
  </div>

  <form (ngSubmit)="addCrop()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Crop Name</label>
      <input type="text" name="name" [(ngModel)]="crop.name" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Price</label>
      <input type="number" name="price" [(ngModel)]="crop.price" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Farmer ID</label>
      <input type="number" name="farmerId" [(ngModel)]="crop.farmerId" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 20px;">
      <label style="display: block; font-weight: bold; margin-bottom: 5px;">Quantity</label>
      <input type="number" name="quantity" [(ngModel)]="crop.quantity" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
    </div>

    <button type="submit" style="width: 100%; padding: 12px; background-color: #2e7d32; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer;">
      Add Crop
    </button>
  </form>
</div>
