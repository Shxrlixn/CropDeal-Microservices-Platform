server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Try to serve file directly, fallback to index.html for Angular routing
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend API Gateway if needed via NGINX (optional if Angular handles it via env vars, but good for CORS)
    # location /api/ {
    #     proxy_pass http://api-gateway:8087/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
