# ================= SERVICE =================
spring.application.name=crop-service
server.port=8089


# ================= DATABASE =================
spring.datasource.url=jdbc:mysql://localhost:3306/cropdb
spring.datasource.username=root
spring.datasource.password=sanjana@4113

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# ================= EUREKA =================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka


# ================= LOGGING =================
logging.file.name=logs/crop-service.log
logging.level.root=INFO
logging.level.com.cropdeal=DEBUG


# ================= FEIGN =================
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000


# ================= ASYNC SUPPORT =================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25