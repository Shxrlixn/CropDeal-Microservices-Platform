server:
  port: 8083

spring:
  application:
    name: admin-user-management-service

  datasource:
    url: jdbc:mysql://localhost:3306/adminuserdb
    username: root
    password: sanjana@4113
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# 🔗 Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

# 🔥 FEIGN FIX (KEEP FOR ADMIN FARMER FLOW)
feign:
  okhttp:
    enabled: true

# 📄 Swagger
springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html

# 📊 Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info

# 🪵 Logging
logging:
  level:
    root: INFO
    com.cropdeal: DEBUG
    org.springframework.cloud.openfeign: DEBUG